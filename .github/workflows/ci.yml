name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and publishing checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Lint source
        run: pnpm run lint

      - name: Validate sitemap
        run: pnpm run check:sitemap

      - name: Validate content
        run: pnpm run check:content

      - name: Validate routes
        run: pnpm run check:routes

      - name: Validate accessibility source rules
        run: pnpm run check:accessibility

      - name: Validate assets
        run: pnpm run check:assets

      - name: Validate security policy
        run: pnpm run check:security-policy

      - name: Audit production dependencies
        run: pnpm run check:dependencies

      - name: Build production application
        run: pnpm run build

      - name: Audit emitted images and JavaScript
        run: pnpm run check:build-assets

      - name: Install Chromium for rendered accessibility tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run rendered accessibility tests
        run: pnpm run check:accessibility:browser

      - name: Upload rendered accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-accessibility-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build asset audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-asset-audit
          path: |
            build-asset-audit.md
            build-asset-audit.json
          if-no-files-found: ignore
          retention-days: 30
