name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and publishing checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run repository validation gate
        run: pnpm run check:ci

      - name: Install Chromium for rendered accessibility tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run rendered accessibility tests
        run: pnpm run check:accessibility:browser

      - name: Upload rendered accessibility report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rendered-accessibility-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build asset audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-asset-audit
          path: |
            build-asset-audit.md
            build-asset-audit.json
          if-no-files-found: ignore
          retention-days: 30
