name: First apartment release dependency patch

on:
  push:
    branches:
      - feat/free-first-apartment-kit
    paths:
      - .github/workflows/first-apartment-release-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/feat/free-first-apartment-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/free-first-apartment-kit
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - name: Update only the existing js-yaml dependency within its allowed range
        run: pnpm update js-yaml --depth 20 --lockfile-only --no-save --ignore-scripts
      - name: Verify manifest stability and security audit
        run: |
          git diff --exit-code -- package.json pnpm-workspace.yaml
          pnpm audit --prod --audit-level high
          git diff --stat
          git diff -- pnpm-lock.yaml
      - name: Commit the generated lockfile on this feature branch only
        run: |
          test "$(git branch --show-current)" = "feat/free-first-apartment-kit"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "No lockfile patch generated; refusing an empty maintenance commit."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m "Patch existing js-yaml dependency for release security gate"
          git push origin HEAD:feat/free-first-apartment-kit
