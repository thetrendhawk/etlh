name: First apartment release dependency patch

on:
  push:
    branches:
      - feat/free-first-apartment-kit
    paths:
      - .github/workflows/first-apartment-release-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/feat/free-first-apartment-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/free-first-apartment-kit
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - name: Keep only the verified js-yaml patch, preserving other locked packages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          original = subprocess.check_output(['git', 'show', '42b6f7d0b024bb1a8313f7ec0be5d8fe7e09bf2b:pnpm-lock.yaml'], text=True)
          generated = Path('pnpm-lock.yaml').read_text()
          def blocks(text, version):
              return re.findall(r'^  js-yaml@' + re.escape(version) + r':.*?(?=^  [^ \n]|\Z)', text, flags=re.M | re.S)
          old_blocks = blocks(original, '4.3.1')
          new_blocks = blocks(generated, '4.3.2')
          assert len(old_blocks) == len(new_blocks) == 2, 'Unexpected lockfile structure'
          def normalized(block):
              return re.sub(r'sha512-[^} \n]+', 'VERIFIED-INTEGRITY', block.replace('4.3.1', 'PATCH').replace('4.3.2', 'PATCH'))
          result = original
          for old, new in zip(old_blocks, new_blocks):
              assert normalized(old) == normalized(new), 'Patch changes package dependencies or metadata unexpectedly'
              result = result.replace(old, new, 1)
          result = result.replace('js-yaml: 4.3.1', 'js-yaml: 4.3.2')
          assert 'js-yaml@4.3.1' not in result and 'js-yaml: 4.3.1' not in result
          Path('pnpm-lock.yaml').write_text(result)
          PY
      - name: Verify frozen installation, manifest stability and security audit
        run: |
          git diff --exit-code -- package.json pnpm-workspace.yaml
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --prod --audit-level high
          git diff 42b6f7d0b024bb1a8313f7ec0be5d8fe7e09bf2b -- pnpm-lock.yaml
      - name: Commit only the narrowed lockfile on the feature branch
        run: |
          test "$(git branch --show-current)" = "feat/free-first-apartment-kit"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m "Limit release dependency patch to js-yaml 4.3.2"
          git push origin HEAD:feat/free-first-apartment-kit
