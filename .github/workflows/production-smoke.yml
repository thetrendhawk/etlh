name: Production smoke checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-smoke.yml"
      - "scripts/check-production.sh"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vercel.json"
      - "vite.config.ts"

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify live ETLH production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Allow production deployment to become ready
        if: github.event_name == 'push'
        run: sleep 30

      - name: Run production smoke checks
        shell: bash
        run: |
          set -o pipefail
          pnpm run check:production 2>&1 | tee production-smoke.log

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: production-smoke-diagnostics
          path: production-smoke.log
          retention-days: 7
